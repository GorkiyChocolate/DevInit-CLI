schema_version: 1
name: prometheus
description: Prometheus metrics collection and monitoring
default_version: "3.13.3"
versions:
  "3.13.3":
    image: prom/prometheus:v3.13.3
defaults:
  ports:
    - "9090:9090"

  volumes:
    - "prometheus_data:/prometheus"

  command:
    - "--config.file=/etc/prometheus/prometheus.yml"
    - "--storage.tsdb.path=/prometheus"
    - "--web.enable-lifecycle"

  restart: unless-stopped

  directories:
    - dir: prometheus
      files:
        - name: prometheus.yml
          mount: /etc/prometheus/prometheus.yml
          content: |
            global:
              scrape_interval: 15s
              evaluation_interval: 15s

            rule_files:
              - /etc/prometheus/alerts.yml

            scrape_configs:
              - job_name: prometheus
                static_configs:
                  - targets:
                      - localhost:9090

        - name: alerts.yml
          mount: /etc/prometheus/alerts.yml
          content: |
            groups: []
